<style>
*{box-sizing:border-box}body{margin:0;font-family:"Alegreya Sans",system-ui,sans-serif;color:#0E2B47;background:#fff}
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{position:sticky;top:0;align-self:start;height:100vh;padding:56px 24px 40px 54px;display:flex;flex-direction:column;gap:30px;overflow:auto}
.logo img{width:150px;height:auto;display:block}
nav{display:flex;flex-direction:column;gap:10px}nav a{color:#0E2B47;text-decoration:none;font-size:16px;font-weight:500}nav a:hover{color:#A64B00}
nav .main{font-weight:700;font-size:17px}nav .sub{display:flex;flex-direction:column;gap:7px;margin:2px 0 6px}nav .sub a{font-size:15px;font-weight:400;color:#2E4A66}
.soc{display:flex;gap:8px}.soc a{width:28px;height:28px;border-radius:50%;background:#E6EAEF;color:#0E2B47;display:flex;align-items:center;justify-content:center}.soc a:hover{background:#0E2B47;color:#fff}
main{padding:34px 54px 60px 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;background:#0E2B47}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.ov{position:absolute;inset:0;background:rgba(14,43,71,.78);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:20px;opacity:0;transition:opacity .35s}
.card:hover .ov,.card:focus-visible .ov{opacity:1}.card:hover img{transform:scale(1.04)}
.yr{font-size:14px;letter-spacing:.14em}.tt{font-size:24px;font-weight:500}
footer{padding:28px 0 0;font-size:13px;color:#6B7A8A}
@media (max-width:820px){.wrap{display:block}aside{position:static;height:auto;padding:28px 22px 6px;gap:18px;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
.logo img{width:76px}nav{flex-direction:row;flex-wrap:wrap;gap:6px 18px}nav .sub{display:none}.soc{width:100%;display:none}
